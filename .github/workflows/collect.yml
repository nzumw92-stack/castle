name: collect
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        run: node --test
      # GitHub starts scheduled runs late or skips them (in practice every 70-90 min).
      # So each run keeps collecting every 10 minutes for up to 5.5 hours; the next scheduled run
      # waits in the queue (concurrency group) and takes over right away, so there is no gap.
      - name: Collect every 10 minutes
        id: run
        run: |
          set +e
          git config user.name "castle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0
          start=$(date +%s); round=0
          while :; do
            round=$((round+1))
            git pull --rebase -q
            node collector/run.mjs || rc=1
            git add data docs/state.json
            if git diff --cached --quiet; then echo "round $round: nothing changed"
            else
              git commit -q -m "castle: update $(date -u +%Y-%m-%dT%H:%MZ)"
              ok=0; for i in 1 2 3; do git pull --rebase -q && git push -q && { ok=1; break; }; sleep 5; done
              [ $ok = 1 ] || rc=1
            fi
            [ $(( $(date +%s) - start )) -ge 19200 ] && break
            sleep 600
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          HASH_SALT: ${{ secrets.HASH_SALT }}
      - name: Report platform errors
        if: steps.run.outputs.rc != '0'
        run: |
          echo "A platform failed, see the Collect step. Last known numbers were kept."
          exit 1
